name: Dashboard checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install established pipeline dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the established synthetic pipeline
        run: python scripts/run_ci_checks.py --output-dir reports/ci-dashboard-fixture
      - name: Install dashboard in a separate environment
        run: |
          python -m venv .venv-dashboard
          python -c "import duckdb; print('duckdb==' + duckdb.__version__)" > reports/dashboard-duckdb-constraint.txt
          .venv-dashboard/bin/python -m pip install -r requirements-dashboard.txt -c reports/dashboard-duckdb-constraint.txt
          .venv-dashboard/bin/python -m pip check
      - name: Exercise dashboard queries and interactive controls
        run: .venv-dashboard/bin/python -m pytest dashboard/checks.py -q --junitxml=reports/dashboard/tests.xml
      - name: Validate fixture dashboard outputs
        run: |
          .venv-dashboard/bin/python scripts/check_dashboard.py --dataset fixture \
            --database reports/ci-dashboard-fixture/work/pipeline_fixture.duckdb \
            --report reports/dashboard/fixture_validation.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dashboard-checks
          path: |
            reports/dashboard
            reports/ci-dashboard-fixture/summary.json
          retention-days: 7

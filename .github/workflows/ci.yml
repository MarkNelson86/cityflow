name: Cityflow CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cityflow-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fixture-checks:
    name: Fixture pipeline (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the proposed code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install the recorded dependency environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Test, build and export the synthetic pipeline
        run: python scripts/run_ci_checks.py
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cityflow-fixture-evidence
          retention-days: 7
          if-no-files-found: warn
          path: |
            reports/ci/*.log
            reports/ci/pytest.xml
            reports/ci/summary.json
            reports/ci/dbt_artifacts/*.json
            reports/ci/exports/overview.md
            reports/ci/exports/run_metadata.json

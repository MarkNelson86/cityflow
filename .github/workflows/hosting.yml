name: Hosting checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/run_ci_checks.py --output-dir reports/ci-hosting-fixture
      - run: |
          python -m venv .venv-hosting-ci
          python -c "import duckdb; print('duckdb==' + duckdb.__version__)" > reports/duckdb-constraint.txt
          .venv-hosting-ci/bin/python -m pip install -r requirements-dashboard.txt -r cloud_dashboard/requirements.txt -c reports/duckdb-constraint.txt
          .venv-hosting-ci/bin/python -m pip check
      - run: .venv-hosting-ci/bin/python -m pytest cloud_dashboard/checks.py -q --junitxml=reports/hosting/pytest.xml
        env:
          CITYFLOW_DASHBOARD_FIXTURE_DB: reports/ci-hosting-fixture/work/pipeline_fixture.duckdb
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hosting-fixture-evidence
          path: reports/hosting
          retention-days: 7
